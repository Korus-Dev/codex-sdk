name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable package version already committed on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Confirm release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('package.json', 'utf8')).version !== process.env.RELEASE_VERSION) throw new Error('Release version must match package.json');"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test, build, and validate package
        run: npm run check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check pinned schema
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-save @openai/codex@0.167.0
          npm run check:schema -- --codex "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex"

      - name: Pack release
        run: npm pack --ignore-scripts --pack-destination release-package

      - name: Publish to npm with trusted publishing
        run: npm publish ./release-package/*.tgz --ignore-scripts --access public --provenance

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the published commit and create release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" \
            --target "$SHA" \
            --title "Codex SDK $VERSION" \
            --generate-notes
