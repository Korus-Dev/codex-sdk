name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.19.0', '26.12.1']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:docs
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Provision isolated pinned CLI
        run: npm install --prefix "$RUNNER_TEMP/codex-cli" --no-save @openai/codex@0.167.0
      - run: npm run check:schema -- --codex "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex"
